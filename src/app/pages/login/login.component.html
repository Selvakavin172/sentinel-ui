<div class="loader-overlay" *ngIf="loading">
  <div class="loader-container">
    <div class="spinner"></div>
    <p>Validating your email...</p>
  </div>
</div>

<div class="login-page">

  <div class="login-card">

    <div class="logo">
      <h1>SentinelFlow</h1>
      <p>AML Transaction Monitoring Platform</p>
    </div>

    <div class="login-content">

      <h2>Welcome Back</h2>

      <p class="subtitle">
        Enter your email to access the system
      </p>

      <form
        #loginForm="ngForm"
        (ngSubmit)="login()">

        <div class="form-group">

          <label>Email Address</label>

          <input
            type="email"
            name="email"
            [(ngModel)]="email"
            #emailField="ngModel"
            placeholder="Enter your email"
            required
            email
            [disabled]="loading">

          <small
            class="error"
            *ngIf="emailField.invalid && emailField.touched">
            Please enter a valid email address.
          </small>

          <small
            class="error"
            *ngIf="errorMessage">
            {{ errorMessage }}
          </small>

        </div>

        <button
          type="submit"
          [disabled]="loginForm.invalid || loading">

          {{ loading ? 'Validating...' : 'Login' }}

        </button>

      </form>

    </div>

  </div>

</div>
